<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Druckdienst - Kontakt</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input[type="text"], input[type="email"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            background-color: #ffffff;
            color: var(--text-color);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            font-size: 16px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .mail-fallback {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            margin-top: 25px;
        }

        .mail-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .mail-link:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    
    <form id="druck-form" action="https://formspree.io" method="POST">
        
        <div class="form-group">
            <label for="name">Ihr Name</label>
            <input type="text" id="name" name="Name" placeholder="Z. B. Max Mustermann" required>
        </div>

        <div class="form-group">
            <label for="email">Ihre E-Mail-Adresse</label>
            <input type="email" id="email" name="_replyto" placeholder="name@beispiel.de" required>
        </div>

        <div class="form-group">
            <label for="typ">Was möchten Sie drucken?</label>
            <select id="typ" name="Druck-Typ">
                <option value="Text">Normaler Text</option>
                <option value="Bild">Bilder / Fotos</option>
                <option value="QR-Code">QR-Code</option>
                <option value="Barcode">Barcode</option>
                <option value="Anderes">Etwas anderes</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nachricht">Inhalt / Beschreibung des Drucks</label>
            <textarea id="nachricht" name="Druck-Inhalt" placeholder="Geben Sie hier Ihren Text oder Details an..." required></textarea>
        </div>

        <input type="hidden" name="_subject" value="Neuer Druckauftrag!">

        <div class="form-group">
            <button type="submit" id="submit-btn" class="btn-submit">Druckauftrag absenden</button>
        </div>

        <div id="status-message"></div>

    </form>
    
    <p class="mail-fallback">
        Alternativ direkt per Mail an: <a href="mailto:noahkanal2024@gmail.com" class="mail-link">noahkanal2024@gmail.com</a>
    </p>
</div>

<script>
    const form = document.getElementById("druck-form");
    
    form.addEventListener("submit", async function(event) {
        event.preventDefault(); // Stoppt die normale Weiterleitung des Browsers
        
        const status = document.getElementById("status-message");
        const button = document.getElementById("submit-btn");
        const formData = new FormData(event.target);
        
        // Button-Zustand während des Sendens ändern
        button.disabled = true;
        button.innerHTML = "Wird gesendet...";
        status.style.display = "none";

        try {
            const response = await fetch(event.target.action, {
                method: form.method,
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (response.ok) {
                status.innerHTML = "✨ Vielen Dank! Ihr Druckauftrag wurde erfolgreich gesendet.";
                status.style.backgroundColor = "var(--success-bg)";
                status.style.color = "var(--success-text)";
                status.style.display = "block";
                button.innerHTML = "Erfolgreich gesendet!";
                button.style.backgroundColor = "#16a34a"; // Grüner Button bei Erfolg
                form.reset(); // Leert die Felder für den nächsten Auftrag
                
                // Nach 4 Sekunden den Button wieder normal machen
                setTimeout(() => {
                    button.disabled = false;
                    button.innerHTML = "Druckauftrag absenden";
                    button.style.backgroundColor = "var(--primary-color)";
                }, 4000);
                
            } else {
                const data = await response.json();
                if (data.errors) {
                    status.innerHTML = data.errors.map(error => error.message).join(", ");
                } else {
                    status.innerHTML = "Hoppla! Es gab ein Problem beim Absenden.";
                }
                showErrorState();
            }
        } catch (error) {
            status.innerHTML = "Verbindungsproblem. Bitte überprüfen Sie Ihre Internetverbindung.";
            showErrorState();
        }

        function showErrorState() {
            status.style.backgroundColor = "var(--error-bg)";
            status.style.color = "var(--error-text)";
            status.style.display = "block";
            button.disabled = false;
            button.innerHTML = "Erneut versuchen";
        }
    });
</script>

</body>
</html>
